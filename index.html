<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 2 占位页</title>
  <style>
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 48px 56px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 28px; color: #1f2329; }
    p { margin: 0; color: #646a73; font-size: 16px; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 16px;
      background: #e8f0fe;
      color: #185fa5;
      border-radius: 999px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，这是我的第一个页面</h1>
    <p>这是 Day 2 的占位页，用来验证仓库第一次提交成功。</p>
    <span class="badge">Day 2｜占位页</span>
  </div>
</body>
</html>
